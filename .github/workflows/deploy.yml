name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Enable web support
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      # ⭐ این مرحله را اضافه کنید: ایجاد پوشه assets در صورتی که وجود ندارد
      - name: Create assets directory if needed
        run: |
          mkdir -p assets
          mkdir -p web

      # ⭐ بیلد با base-href صحیح
      - name: Build web
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}" ]; then
            # اگر پروژه user page است (username.github.io)
            flutter build web --release --base-href /
          else
            # اگر پروژه project page است
            flutter build web --release --base-href /${{ github.event.repository.name }}/
          fi

      # ⭐ بررسی محتویات پوشه build/web
      - name: List build/web contents
        run: ls -la build/web/

      # ⭐ اطمینان از وجود فایل index.html
      - name: Verify index.html exists
        run: |
          if [ ! -f "build/web/index.html" ]; then
            echo "ERROR: index.html not found in build/web/"
            exit 1
          fi
          echo "✅ index.html found!"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy web build: ${{ github.sha }}"
          # ⭐ این گزینه را اضافه کنید
          exclude_assets: '.github,README.md'
