name: javidnaman
description: "Javidnaman 1404 DATA"

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.3.1
  infinite_scroll_pagination: ^4.0.0
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  provider: ^6.1.1
  flutter_lints: ^6.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true

  assets:
  - assets/persepolis_bg.jpg
  - assets/javidnams_data.json
  - assets/intro_bg.jpg
  - assets/epic_music.mp3
  - assets/poems.json
  

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: fonts/Vazirmatn-Bold.ttf
          weight: 700
  
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#121212"
    theme_color: "#E8B86D"
  
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  
  macos:
    generate: false
  
  linux:
    generate: true
    image_path: "assets/icon/icon.png"


